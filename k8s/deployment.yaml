apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-event-handler
  namespace: eventhandler
  labels:
    app: configmap-event-handler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-event-handler
  template:
    metadata:
      labels:
        app: configmap-event-handler
    spec:
      serviceAccountName: configmap-event-handler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: configmap-event-handler
        image: configmap-event-handler:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Set to true if app doesn't need to write
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        # Optional: Override deployment name to restart after ConfigMap patch
        # Defaults to "registration-agent" if not set
        # - name: RESTART_DEPLOYMENT
        #   value: "registration-agent"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

